<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mummster Curation</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      height: 100vh; display: flex; flex-direction: column;
      background: #1a1a2e; color: #e0e0e0; overflow: hidden;
    }

    /* ── Top bar ─────────────────────────────────────────────────────── */
    .top-bar {
      display: flex; align-items: center; gap: 14px;
      padding: 7px 16px; background: #0d1b2a;
      border-bottom: 1px solid #3a3a5c; flex-shrink: 0; font-size: 0.85em;
    }
    .top-bar label { color: #94a3b8; font-weight: 600; font-size: 0.82em; text-transform: uppercase; letter-spacing: 0.05em; }
    #year-select {
      padding: 4px 10px; background: #1e2a3a; border: 1px solid #4a6fa5;
      border-radius: 4px; color: #e0e0e0; font-size: 0.9em; cursor: pointer; min-width: 110px;
    }
    #year-select:focus { outline: none; border-color: #4a9eff; }
    #year-loading { color: #4a9eff; font-size: 0.78em; display: none; }
    .top-title { color: #c8dfff; font-weight: 600; font-size: 0.88em; margin-right: auto; }

    /* ── Complete year banner ────────────────────────────────────────── */
    #complete-banner {
      display: none; align-items: center; gap: 12px;
      padding: 7px 16px; background: #0f2a1a;
      border-bottom: 1px solid #2d6a2d; flex-shrink: 0; font-size: 0.82em; color: #a0e0a0;
    }
    #complete-banner.visible { display: flex; }
    #complete-banner .banner-msg { flex: 1; }
    #unlock-btn {
      padding: 4px 12px; background: none; border: 1px solid #4ade80;
      color: #4ade80; border-radius: 4px; cursor: pointer; font-size: 0.8em; font-family: inherit;
    }
    #unlock-btn:hover { background: rgba(74,222,128,0.1); }

    /* ── Toast ───────────────────────────────────────────────────────── */
    #toast {
      position: fixed; bottom: 52px; right: 16px; z-index: 9999;
      background: #166534; color: #bbf7d0; border: 1px solid #4ade80;
      border-radius: 6px; padding: 7px 16px; font-size: 0.82em;
      opacity: 0; transition: opacity 0.25s; pointer-events: none; max-width: 480px;
    }
    #toast.show { opacity: 1; }
    #toast.error { background: #7f1d1d; color: #fca5a5; border-color: #f87171; }
    #toast.warn  { background: #713f12; color: #fef3c7; border-color: #f59e0b; }

    /* ── Modal overlay ───────────────────────────────────────────────── */
    .modal-overlay {
      display: none; position: fixed; inset: 0; z-index: 500;
      background: rgba(0,0,0,0.75);
      align-items: center; justify-content: center; padding: 1rem;
    }
    .modal-overlay.visible { display: flex; }
    .modal-box {
      background: #111c2d; border: 1px solid #3a3a5c; border-radius: 10px;
      padding: 1.5rem; width: 100%; max-width: 560px;
      display: flex; flex-direction: column; gap: 1rem;
    }
    .modal-title {
      font-size: 1rem; font-weight: 600; color: #c8dfff;
      border-bottom: 1px solid #2a3a5c; padding-bottom: 0.75rem;
    }
    .modal-body { font-size: 0.85em; color: #94a3b8; line-height: 1.6; }
    .modal-body strong { color: #e0e0e0; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
    .btn-primary {
      padding: 6px 18px; background: #166534; color: #bbf7d0;
      border: 1px solid #4ade80; border-radius: 4px; cursor: pointer; font-size: 0.82em; font-family: inherit;
    }
    .btn-primary:hover { background: #15803d; }
    .btn-danger {
      padding: 6px 18px; background: #7f1d1d; color: #fca5a5;
      border: 1px solid #f87171; border-radius: 4px; cursor: pointer; font-size: 0.82em; font-family: inherit;
    }
    .btn-danger:hover { background: #991b1b; }
    .btn-cancel {
      padding: 6px 18px; background: none; color: #6e8faf;
      border: 1px solid #3a3a5c; border-radius: 4px; cursor: pointer; font-size: 0.82em; font-family: inherit;
    }
    .btn-cancel:hover { border-color: #4a6fa5; color: #d0e8ff; }

    /* Upload modal specifics */
    .upload-section { display: flex; flex-direction: column; gap: 0.75rem; }
    .upload-section label { font-size: 0.8em; color: #94a3b8; font-weight: 600; }
    .upload-section input[type=file] {
      padding: 6px; background: #1e2a3a; border: 1px solid #4a6fa5;
      border-radius: 4px; color: #e0e0e0; font-size: 0.82em; cursor: pointer;
    }
    .radio-group { display: flex; flex-direction: column; gap: 6px; }
    .radio-group label {
      display: flex; align-items: flex-start; gap: 8px;
      cursor: pointer; font-size: 0.82em; color: #c0c0d0; font-weight: 400;
    }
    .radio-group input[type=radio] { margin-top: 2px; }
    .radio-label-main { font-weight: 600; color: #e0e0e0; }
    .radio-label-desc { color: #6e8faf; font-size: 0.95em; }
    #upload-year-display { color: #4a9eff; font-weight: 600; }
    #upload-preview {
      background: #0f1a2b; border: 1px solid #2a3a5c; border-radius: 6px;
      padding: 0.75rem; font-size: 0.78em; color: #94a3b8; font-family: monospace;
      white-space: pre-wrap; max-height: 120px; overflow-y: auto;
    }
    #upload-preview.hidden { display: none; }
    #upload-warnings {
      background: #2a1a00; border: 1px solid #f59e0b; border-radius: 6px;
      padding: 0.6rem 0.75rem; font-size: 0.76em; color: #fef3c7;
      max-height: 80px; overflow-y: auto;
    }
    #upload-warnings.hidden { display: none; }

    /* ── Two-panel area ──────────────────────────────────────────────── */
    .panels { display: flex; flex: 1; overflow: hidden; }

    /* ── Left panel ──────────────────────────────────────────────────── */
    .left-panel {
      width: 40%; flex-shrink: 0; display: flex; flex-direction: column;
      background: #16213e; border-right: 1px solid #3a3a5c; overflow: hidden;
    }
    .pdf-viewer {
      flex: 1; overflow: auto; display: flex;
      align-items: flex-start; justify-content: center; padding: 8px;
    }
    .pdf-viewer img { max-width: 100%; height: auto; border: 1px solid #444; display: block; }
    .pdf-viewer .no-image { color: #666; font-size: 0.9em; margin: 40px auto; }
    .page-nav {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      padding: 8px 12px; border-top: 1px solid #3a3a5c; background: #0d1b2a; flex-shrink: 0;
    }
    .page-nav button {
      padding: 5px 14px; background: #0f3460; color: #d0e8ff;
      border: 1px solid #4a6fa5; border-radius: 4px; cursor: pointer; font-size: 0.85em;
    }
    .page-nav button:hover:not(:disabled) { background: #1a4a80; }
    .page-nav button:disabled { opacity: 0.35; cursor: not-allowed; }
    .page-indicator { color: #888; font-size: 0.85em; min-width: 80px; text-align: center; }

    /* ── Right panel ─────────────────────────────────────────────────── */
    .right-panel {
      flex: 1; display: flex; flex-direction: column;
      padding: 10px; gap: 8px; overflow: hidden;
    }
    .grid-toolbar { display: flex; align-items: center; gap: 8px; flex-shrink: 0; flex-wrap: wrap; }
    .grid-toolbar button {
      padding: 5px 12px; background: #0f3460; color: #d0e8ff;
      border: 1px solid #4a6fa5; border-radius: 4px; cursor: pointer; font-size: 0.82em;
    }
    .grid-toolbar button:hover:not(:disabled) { background: #1a4a80; }
    .grid-toolbar button:disabled { opacity: 0.4; cursor: not-allowed; }
    #extract-btn { background: #1a3a1a; border-color: #4ade80; color: #bbf7d0; }
    #extract-btn:hover:not(:disabled) { background: #243a24; }
    #extract-btn.busy { opacity: 0.55; cursor: not-allowed; }
    .extract-status { color: #94a3b8; font-size: 0.78em; }
    .col-add-form { display: flex; align-items: center; gap: 4px; }
    .col-add-form input {
      padding: 4px 8px; background: #1e2a3a; border: 1px solid #4a6fa5;
      border-radius: 4px; color: #e0e0e0; font-size: 0.82em; width: 170px; outline: none;
    }
    .col-add-form input:focus { border-color: #4a9eff; }
    .col-add-form button { padding: 4px 10px; }
    .col-cancel { background: #3a1a1a !important; border-color: #f87171 !important; color: #fca5a5 !important; }
    .hidden { display: none !important; }
    .grid-wrap { flex: 1; overflow: auto; border: 1px solid #3a3a5c; border-radius: 4px; }

    /* ── Table ───────────────────────────────────────────────────────── */
    table { border-collapse: collapse; min-width: 100%; width: max-content; }
    thead tr { position: sticky; top: 0; z-index: 10; }
    th {
      background: #0f3460; color: #c8dfff; padding: 0;
      border: 1px solid #3a3a5c; font-size: 0.8em; font-weight: 600;
      white-space: nowrap; min-width: 110px;
    }
    th.band-th { min-width: 200px; }
    .th-inner { display: flex; align-items: center; justify-content: space-between; padding: 5px 8px; gap: 4px; }
    .col-letter { font-size: 0.7em; color: #3a5472; font-weight: 400; margin-right: 2px; }
    .del-col {
      background: none; border: none; color: #f87171; cursor: pointer;
      font-size: 0.9em; padding: 0 2px; line-height: 1; flex-shrink: 0;
      opacity: 0; transition: opacity 0.1s;
    }
    th:hover .del-col { opacity: 1; }
    .del-col:hover { color: #fca5a5; }
    .col-name { cursor: default; user-select: none; }
    .col-name:hover { color: #e0f2fe; }
    .col-rename-input {
      width: 110px; padding: 2px 4px; background: #1e2a3a; border: 1px solid #4a9eff;
      border-radius: 3px; color: #e0e0e0; font-size: 0.8em; font-family: inherit; outline: none;
    }
    td {
      border: 1px solid #2a2a4a; padding: 0; height: 28px; position: relative;
    }
    td input {
      width: 100%; height: 100%; padding: 3px 6px; background: transparent;
      border: none; color: #e0e0e0; font-size: 0.82em; font-family: inherit; outline: none;
    }
    td input:focus { background: #1e3660; outline: 2px solid #4a9eff; outline-offset: -2px; }
    td input:disabled { cursor: not-allowed; color: #555; }
    td.band-td { min-width: 200px; }
    td.band-td input { color: #93c5fd; }
    tbody tr:nth-child(even) td { background: rgba(255,255,255,0.02); }
    tbody tr:hover td { background: rgba(255,255,255,0.04); }
    tbody tr:hover td.band-td { background: rgba(255,255,255,0.04); }

    /* ── Formula cell ────────────────────────────────────────────────── */
    td.formula-cell::before {
      content: ''; position: absolute; top: 0; right: 0;
      width: 0; height: 0; border-style: solid;
      border-width: 0 7px 7px 0; border-color: transparent #4a9eff transparent transparent;
      pointer-events: none; z-index: 2;
    }
    td.formula-cell input { color: #93c5fd; }

    /* ── Confidence ──────────────────────────────────────────────────── */
    td.conf-high { background: rgba(74,222,128,0.09) !important; }
    td.conf-high input { color: #d1fae5; }
    td.conf-med  { background: rgba(251,191,36,0.09) !important; }
    td.conf-med input  { color: #fef3c7; }
    td.conf-low  { background: rgba(248,113,113,0.09) !important; }
    td.conf-low input  { color: #fee2e2; }
    td.conf-high::after, td.conf-med::after, td.conf-low::after {
      content: ''; position: absolute; top: 2px; right: 2px;
      width: 5px; height: 5px; border-radius: 50%;
    }
    td.formula-cell.conf-high::after,
    td.formula-cell.conf-med::after,
    td.formula-cell.conf-low::after { right: 10px; }
    td.conf-high::after { background: #4ade80; }
    td.conf-med::after  { background: #fbbf24; }
    td.conf-low::after  { background: #f87171; }

    /* ── Bottom bar ──────────────────────────────────────────────────── */
    .bottom-bar {
      display: flex; align-items: center; gap: 10px;
      padding: 7px 16px; background: #0d1b2a; border-top: 1px solid #3a3a5c;
      font-size: 0.82em; flex-shrink: 0; flex-wrap: wrap;
    }
    .meta { color: #aaa; }
    .meta span { color: #e0e0e0; font-weight: 500; margin-left: 4px; }
    .legend { display: flex; align-items: center; gap: 6px; color: #666; font-size: 0.78em; }
    .legend-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
    .spacer { flex: 1; }
    #save-btn {
      padding: 5px 16px; background: #166534; color: #bbf7d0;
      border: 1px solid #4ade80; border-radius: 4px; cursor: pointer; font-size: 0.82em;
    }
    #save-btn:hover:not(:disabled) { background: #15803d; }
    #save-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    #upload-csv-btn {
      padding: 5px 12px; background: #1e3a5f; color: #bfdbfe;
      border: 1px solid #4a6fa5; border-radius: 4px; cursor: pointer; font-size: 0.82em;
    }
    #upload-csv-btn:hover:not(:disabled) { background: #1e4080; }
    #upload-csv-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    #export-btn {
      padding: 5px 14px; background: #1e3a5f; color: #bfdbfe;
      border: 1px solid #4a6fa5; border-radius: 4px; cursor: pointer; font-size: 0.82em;
    }
    #export-btn:hover { background: #1e4080; }
    #mark-complete-btn {
      padding: 5px 12px; background: #166534; color: #bbf7d0;
      border: 1px solid #4ade80; border-radius: 4px; cursor: pointer; font-size: 0.82em;
    }
    #mark-complete-btn:hover:not(:disabled) { background: #15803d; }
    #mark-complete-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    #status-ind { font-size: 0.8em; min-width: 120px; text-align: right; }
    #status-ind.saved   { color: #4ade80; }
    #status-ind.unsaved { color: #fb923c; }

    /* ── Load Year button & modal ────────────────────────────────────── */
    #load-year-btn {
      padding: 4px 10px; background: #1a2a4a; color: #93c5fd;
      border: 1px solid #4a6fa5; border-radius: 4px; cursor: pointer;
      font-size: 0.82em; font-family: inherit;
    }
    #load-year-btn:hover { background: #1e3a6a; }
    #load-year-select {
      width: 100%; padding: 6px 8px; background: #1e2a3a;
      border: 1px solid #4a6fa5; border-radius: 4px; color: #e0e0e0;
      font-size: 0.85em; cursor: pointer; margin-top: 0.5rem;
    }
    #load-year-select:disabled { opacity: 0.5; cursor: not-allowed; }
    #load-year-status { color: #94a3b8; font-size: 0.85em; min-height: 1.4em; }
    #load-year-status.error { color: #fca5a5; }
    #load-year-status.ok    { color: #4ade80; }
    #load-year-confirm-btn.loading { opacity: 0.55; cursor: not-allowed; }
  </style>
</head>
<body>

<!-- Top bar -->
<div class="top-bar">
  <span class="top-title">MummSTER Curation Tool</span>
  <label for="year-select">Year</label>
  <select id="year-select"></select>
  <span id="year-loading">Loading…</span>
  <button id="load-year-btn">+ Load Year</button>
</div>

<!-- Complete year banner -->
<div id="complete-banner">
  <span class="banner-msg">✓ Year <strong id="banner-year">—</strong> is marked complete. Grid is read-only.</span>
  <button id="unlock-btn">Unlock to edit</button>
</div>

<div id="toast"></div>

<!-- Completion confirmation modal -->
<div id="complete-modal" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-title">Mark Year Complete</div>
    <div class="modal-body" id="complete-modal-body">—</div>
    <div class="modal-actions">
      <button class="btn-cancel" id="complete-cancel-btn">Cancel</button>
      <button class="btn-primary" id="complete-confirm-btn">✓ Mark Complete &amp; Archive CSV</button>
    </div>
  </div>
</div>

<!-- Unlock confirmation modal -->
<div id="unlock-modal" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-title">Unlock Year</div>
    <div class="modal-body" id="unlock-modal-body">—</div>
    <div class="modal-actions">
      <button class="btn-cancel" id="unlock-cancel-btn">Cancel</button>
      <button class="btn-danger" id="unlock-confirm-btn">Unlock &amp; Allow Editing</button>
    </div>
  </div>
</div>

<!-- Load Year modal -->
<div id="load-year-modal" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-title">Load a Year's PDF from the Pipeline</div>
    <div class="modal-body">
      <div id="load-year-status">Fetching available years…</div>
      <select id="load-year-select" size="1" disabled></select>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" id="load-year-cancel-btn">Cancel</button>
      <button class="btn-primary" id="load-year-confirm-btn" disabled>Load Year</button>
    </div>
  </div>
</div>

<!-- Upload CSV modal -->
<div id="upload-modal" class="modal-overlay">
  <div class="modal-box" style="max-width:600px">
    <div class="modal-title">Upload CSV</div>
    <div class="upload-section">
      <div>Uploading for year: <span id="upload-year-display">—</span></div>
      <div>
        <label>CSV file (wide format: band, page_number, col1, col2, …)</label>
        <input type="file" id="upload-file-input" accept=".csv">
      </div>
      <div>
        <label>Mode</label>
        <div class="radio-group">
          <label>
            <input type="radio" name="upload-mode" value="replace" checked>
            <div>
              <div class="radio-label-main">Replace</div>
              <div class="radio-label-desc">Wipe data for the pages present in the CSV, then insert</div>
            </div>
          </label>
          <label>
            <input type="radio" name="upload-mode" value="merge">
            <div>
              <div class="radio-label-main">Merge</div>
              <div class="radio-label-desc">Update cells in CSV; leave cells not in CSV untouched</div>
            </div>
          </label>
        </div>
      </div>
      <div id="upload-preview" class="hidden">—</div>
      <div id="upload-warnings" class="hidden"></div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" id="upload-cancel-btn">Cancel</button>
      <button class="btn-primary" id="upload-confirm-btn" disabled>Upload</button>
    </div>
  </div>
</div>

<div class="panels">
  <div class="left-panel">
    <div class="pdf-viewer" id="pdf-viewer"><span class="no-image">Loading…</span></div>
    <div class="page-nav">
      <button id="prev-btn" disabled>&#9664; Prev</button>
      <span class="page-indicator" id="page-indicator">Page — of —</span>
      <button id="next-btn" disabled>Next &#9654;</button>
    </div>
  </div>
  <div class="right-panel">
    <div class="grid-toolbar">
      <button id="extract-btn">&#x1F916; Extract Page</button>
      <span id="extract-status" class="extract-status"></span>
      <button id="add-col-btn">+ Add Column</button>
      <form id="col-add-form" class="col-add-form hidden">
        <input id="col-name-input" list="col-datalist" placeholder="Column name…" autocomplete="off">
        <datalist id="col-datalist"></datalist>
        <button type="submit">Add</button>
        <button type="button" id="col-cancel-btn" class="col-cancel">✕</button>
      </form>
    </div>
    <div class="grid-wrap">
      <table id="grid">
        <thead><tr id="header-row"></tr></thead>
        <tbody id="grid-body"></tbody>
      </table>
    </div>
  </div>
</div>

<div class="bottom-bar">
  <div class="meta">Year:<span id="lbl-year">—</span></div>
  <div class="meta">Page:<span id="lbl-page">—</span></div>
  <div class="legend">
    <span class="legend-dot" style="background:#4ade80"></span>high
    <span class="legend-dot" style="background:#fbbf24"></span>uncertain
    <span class="legend-dot" style="background:#f87171"></span>low
    — AI confidence &nbsp;|&nbsp;
    <span style="display:inline-block;width:0;height:0;border-style:solid;border-width:0 6px 6px 0;border-color:transparent #4a9eff transparent transparent;vertical-align:middle;margin-right:3px"></span>formula
  </div>
  <div class="spacer"></div>
  <button id="save-btn">&#128190; Save</button>
  <button id="upload-csv-btn">&#8593; Upload CSV</button>
  <button id="export-btn">&#8595; Export CSV</button>
  <button id="mark-complete-btn">&#10003; Mark Complete</button>
  <span id="status-ind" class="saved">Saved</span>
</div>

<script>
"use strict";

const FIELD_DICT = [
  'Music','Costume','Costume & Props','Presentation','String Performance',
  'Brass Performance','Brass','Comic Performance','Originality',
  'General Effect','Overall Performance','Theme','Style','Musicianship',
  'Movement','Marching','Ensemble','Pageantry','Percussion',
  'Total Score','Net Score','Placement','Prize Money','Penalty',
];

// ── State ─────────────────────────────────────────────────────────────────────
const S = {
  year:         1977,
  availYears:   [],
  yearStatuses: {},
  pagesPrefix:  "",
  pageCount:    0,
  currentPage:  1,
  bands:        [],
  infoBands:    [],   // pre-populated band list from mummster DB (page 1 fallback)
  columns:      [],
  cells:        {},
  formulas:     {},
  confidence:   {},
  confirmed:    {},
  unsaved:      false,
};

function isComplete() { return S.yearStatuses[S.year] === 'complete'; }

// ── DOM ───────────────────────────────────────────────────────────────────────
const yearSelect     = document.getElementById('year-select');
const yearLoading    = document.getElementById('year-loading');
const completeBanner = document.getElementById('complete-banner');
const bannerYear     = document.getElementById('banner-year');
const unlockBtn      = document.getElementById('unlock-btn');
const pdfViewer      = document.getElementById('pdf-viewer');
const prevBtn        = document.getElementById('prev-btn');
const nextBtn        = document.getElementById('next-btn');
const pageInd        = document.getElementById('page-indicator');
const lblYear        = document.getElementById('lbl-year');
const lblPage        = document.getElementById('lbl-page');
const headerRow      = document.getElementById('header-row');
const gridBody       = document.getElementById('grid-body');
const addColBtn      = document.getElementById('add-col-btn');
const colAddForm     = document.getElementById('col-add-form');

// ── Toast ─────────────────────────────────────────────────────────────────────
let toastTimer = null;
function showToast(msg, type = 'ok') {
  if (toastTimer) clearTimeout(toastTimer);
  toast.textContent = msg;
  toast.className = type === 'error' ? 'error show' : type === 'warn' ? 'warn show' : 'show';
  const delay = type === 'warn' ? 6000 : 3000;
  toastTimer = setTimeout(() => { toast.className = ''; }, delay);
}

// ── Helpers ───────────────────────────────────────────────────────────────────
const key = (band, col) => `${band}|${col}`;
function allColumns() { return ['Band Name', ...S.columns]; }

function markUnsaved(v) {
  S.unsaved = v;
  statusInd.textContent = v ? 'Unsaved changes' : 'Saved';
  statusInd.className = v ? 'unsaved' : 'saved';
}

}

// ── Formula engine ────────────────────────────────────────────────────────────
function colLetterToIdx(letter) {
  if (letter.length !== 1) throw new Error(`Multi-letter columns not supported: ${letter}`);
  return letter.toUpperCase().charCodeAt(0) - 65;
}
function idxToColLetter(idx) { return String.fromCharCode(65 + idx); }

function parseCellRef(ref) {
  const m = ref.trim().toUpperCase().match(/^([A-Z]+)(\d+)$/);
  if (!m) throw new Error(`Invalid cell reference: ${ref}`);
  return { colIdx: colLetterToIdx(m[1]), rowIdx: parseInt(m[2]) - 1 };
}

function resolveRef(ref) {
  const { colIdx, rowIdx } = parseCellRef(ref);
  const cols = allColumns();
  if (colIdx >= cols.length) throw new Error(`Column ${idxToColLetter(colIdx)} is out of range`);
  if (rowIdx < 0 || rowIdx >= S.bands.length) throw new Error(`Row ${rowIdx + 1} is out of range`);
  const colName = cols[colIdx];
  if (colName === 'Band Name') throw new Error('Column A (Band Name) is text, not numeric');
  const val = S.cells[key(S.bands[rowIdx], colName)] || '';
  if (val === '') return null;
  const n = parseFloat(val);
  if (isNaN(n)) throw new Error(`Cell ${ref.toUpperCase()} is not numeric: "${val}"`);
  return n;
}

function expandRange(rangeStr) {
  const parts = rangeStr.trim().split(':');
  if (parts.length !== 2) throw new Error(`Invalid range: ${rangeStr}`);
  const s = parseCellRef(parts[0]), e = parseCellRef(parts[1]);
  const refs = [];
  for (let r = Math.min(s.rowIdx, e.rowIdx); r <= Math.max(s.rowIdx, e.rowIdx); r++)
    for (let c = Math.min(s.colIdx, e.colIdx); c <= Math.max(s.colIdx, e.colIdx); c++)
      refs.push(`${idxToColLetter(c)}${r + 1}`);
  return refs;
}

function evalFormula(formula) {
  const f = formula.trim();
  if (!f.startsWith('=')) throw new Error('Formula must start with =');
  const inner = f.slice(1).trim();
  const fm = inner.match(/^([A-Za-z]+)\s*\((.+)\)\s*$/s);
  if (!fm) throw new Error(`Cannot parse formula: ${f}`);
  const fn = fm[1].toUpperCase();
  if (fn !== 'SUM' && fn !== 'AVG' && fn !== 'AVERAGE')
    throw new Error(`Only SUM and AVG/AVERAGE are supported (got ${fn})`);
  const argsStr = fm[2].trim();
  let refs;
  if (argsStr.includes(':') && !argsStr.includes(',')) {
    refs = expandRange(argsStr);
  } else {
    refs = argsStr.split(',').map(s => s.trim())
      .flatMap(r => r.includes(':') ? expandRange(r) : [r]);
  }
  const nums = refs.map(resolveRef).filter(n => n !== null);
  if (!nums.length) throw new Error('All referenced cells are empty');
  const sum = nums.reduce((a, b) => a + b, 0);
  return fn === 'SUM' ? sum : sum / nums.length;
}

function fmtNum(n) { return String(Math.round(n * 10000) / 10000); }

function applyFormula(inp, band, col, formula) {
  try {
    const result = evalFormula(formula);
    const str = fmtNum(result);
    S.cells[key(band, col)] = str;
    S.formulas[key(band, col)] = formula;
    inp.value = str;
    const td = inp.closest('td');
    if (td) { td.classList.add('formula-cell'); td.classList.remove('conf-high','conf-med','conf-low'); }
    S.confirmed[key(band, col)] = true;
    markUnsaved(true);
    showToast(`✓ ${formula} = ${str}`);
    return true;
  } catch (err) {
    showToast(err.message, 'error');
    return false;
  }
}

// ── PDF viewer ────────────────────────────────────────────────────────────────
function updatePage() {
  const p = S.currentPage, n = S.pageCount;
  lblPage.textContent = `${p} of ${n}`;
  pageInd.textContent = `Page ${p} of ${n}`;
  prevBtn.disabled = p <= 1;
  nextBtn.disabled = p >= n;
  pdfViewer.innerHTML = '';
  if (!n) {
    const msg = document.createElement('span');
    msg.className = 'no-image'; msg.textContent = 'No PDF pages found for this year.';
    pdfViewer.appendChild(msg); return;
  }
  const img = document.createElement('img');
  img.src = `/pages/${S.pagesPrefix}page_${String(p).padStart(3,'0')}.png`;
  img.alt = `Page ${p}`;
  pdfViewer.appendChild(img);
}

// ── Page navigation with data reload ─────────────────────────────────────────
prevBtn.addEventListener('click', () => navigateToPage(S.currentPage - 1));
nextBtn.addEventListener('click', () => navigateToPage(S.currentPage + 1));

async function navigateToPage(newPage) {
  if (newPage < 1 || newPage > S.pageCount || newPage === S.currentPage) return;
  if (S.unsaved) {
    const ok = confirm(
      `You have unsaved changes on page ${S.currentPage}.\nDiscard and go to page ${newPage}?`
    );
    if (!ok) return;
  }
  S.currentPage = newPage;
  updatePage();
  await loadPageData(newPage);
}

async function loadPageData(page) {
  extractStat.textContent = '';
  try {
    const res = await fetch(`/api/data?year=${S.year}&page=${page}`);
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();

    // Page 1: fall back to pre-populated band list if no saved data yet
    S.bands    = (data.bands && data.bands.length > 0)
                   ? data.bands
                   : (page === 1 ? S.infoBands : []);
    S.columns   = data.columns  || [];
    S.cells     = data.cells    || {};
    S.formulas  = data.formulas || {};
    S.confidence = {};
    S.confirmed  = {};
    Object.keys(S.formulas).forEach(k => { S.confirmed[k] = true; });
    markUnsaved(false);
    renderTable();
    if (S.columns.length === 0) {
      extractStat.textContent = `Page ${page} — click Extract Page to extract`;
    }
  } catch (err) {
    showToast('Error loading page data: ' + err.message, 'error');
  }
}

// ── Confidence ────────────────────────────────────────────────────────────────
function confClass(band, col) {
  const k = key(band, col);
  if (S.confirmed[k]) return '';
  const c = S.confidence[k];
  if (c === undefined) return '';
  return c >= 0.85 ? 'conf-high' : c >= 0.50 ? 'conf-med' : c > 0 ? 'conf-low' : '';
}

function confirmCell(ri, ci) {
  const cols = allColumns();
  const col = cols[ci]; if (col === 'Band Name') return;
  const band = S.bands[ri];
  S.confirmed[key(band, col)] = true;
  const rows = gridBody.querySelectorAll('tr');
  if (rows[ri]) {
    const tds = rows[ri].querySelectorAll('td');
    if (tds[ci]) tds[ci].classList.remove('conf-high','conf-med','conf-low');
  }
}

// ── Grid render ───────────────────────────────────────────────────────────────
function renderTable() {
  const cols = allColumns();
  const ro = isComplete();

  headerRow.innerHTML = '';
  cols.forEach((col, ci) => {
    const th = document.createElement('th');
    if (col === 'Band Name') th.classList.add('band-th');
    const inner = document.createElement('div'); inner.className = 'th-inner';
    if (col === 'Band Name') {
      inner.appendChild(document.createTextNode(col));
    } else {
      const letterEl = document.createElement('span');
      letterEl.className = 'col-letter'; letterEl.textContent = idxToColLetter(ci) + ' ';
      inner.appendChild(letterEl);
      const nameSpan = document.createElement('span');
      nameSpan.className = 'col-name'; nameSpan.textContent = col;
      nameSpan.title = ro ? col : 'Double-click to rename';
      if (!ro) nameSpan.addEventListener('dblclick', e => { e.stopPropagation(); startColRename(col, nameSpan); });
      inner.appendChild(nameSpan);
    }
    if (col !== 'Band Name' && !ro) {
      const del = document.createElement('button');
      del.className = 'del-col'; del.textContent = '×'; del.title = `Delete column "${col}"`;
      del.addEventListener('click', e => { e.stopPropagation(); deleteColumn(col); });
      inner.appendChild(del);
    }
    th.appendChild(inner); headerRow.appendChild(th);
  });

  gridBody.innerHTML = '';
  S.bands.forEach((band, ri) => {
    const tr = document.createElement('tr');
    cols.forEach((col, ci) => {
      const td = document.createElement('td');
      const k = key(band, col);
      if (col === 'Band Name') {
        td.classList.add('band-td');
      } else if (S.formulas[k]) {
        td.classList.add('formula-cell');
      } else {
        const cc = confClass(band, col);
        if (cc) td.classList.add(cc);
      }

      const inp = document.createElement('input');
      inp.type = 'text';
      inp.value = col === 'Band Name' ? band : (S.cells[k] || '');
      inp.dataset.ri = ri; inp.dataset.ci = ci;
      if (ro) { inp.disabled = true; }
      else if (col === 'Band Name') {
        inp.tabIndex = -1;
        inp.addEventListener('blur', () => {
          const cur = S.bands[ri]; const nv = inp.value.trim();
          if (!nv) { inp.value = cur; return; }
          if (nv !== cur) renameBand(cur, nv, ri);
        });
        inp.addEventListener('keydown', e => {
          if (e.key === 'Enter') inp.blur();
          else if (e.key === 'Escape') { inp.value = S.bands[ri]; inp.blur(); }
        });
      } else {
        inp.addEventListener('dblclick', () => {
          const f = S.formulas[k];
          if (f && inp.value !== f) { inp.value = f; inp.select(); }
        });
        inp.addEventListener('input', () => {
          if (!inp.value.startsWith('=')) {
            S.cells[k] = inp.value;
            if (S.formulas[k]) { delete S.formulas[k]; td.classList.remove('formula-cell'); }
            confirmCell(ri, ci); markUnsaved(true);
          }
        });
        inp.addEventListener('keydown', e => {
          if (e.key === 'Enter') {
            const val = inp.value.trim();
            if (val.startsWith('=')) {
              e.preventDefault(); e.stopPropagation();
              const ok = applyFormula(inp, band, col, val);
              if (ok) focusCell(Math.min(ri + 1, S.bands.length - 1), ci);
              return;
            }
          }
          if (e.key === 'Escape' && inp.value.startsWith('=')) { inp.value = S.cells[k] || ''; return; }
          handleNav(e, ri, ci);
        });
        inp.addEventListener('blur', () => {
          if (inp.value.trim().startsWith('=')) inp.value = S.cells[k] || '';
        });
      }
      td.appendChild(inp); tr.appendChild(td);
    });
    gridBody.appendChild(tr);
  });
}

function handleNav(e, ri, ci) {
  const cols = allColumns();
  if (e.key === 'Tab' || e.key === 'Enter') confirmCell(ri, ci);
  if (e.key === 'Tab') {
    e.preventDefault();
    let nr = ri, nc = ci + (e.shiftKey ? -1 : 1);
    if (nc === 0) nc = e.shiftKey ? cols.length - 1 : 1;
    if (nc >= cols.length) { nc = 1; nr++; }
    if (nc < 1)            { nc = cols.length - 1; nr--; }
    focusCell(Math.max(0, Math.min(nr, S.bands.length - 1)), nc);
  } else if (e.key === 'Enter') {
    e.preventDefault();
    focusCell(Math.min(ri + 1, S.bands.length - 1), ci);
  }
}

function focusCell(ri, ci) {
  const rows = gridBody.querySelectorAll('tr');
  if (!rows[ri]) return;
  const inp = rows[ri].querySelectorAll('input')[ci];
  if (inp && !inp.disabled) inp.focus();
}

// ── Column management ─────────────────────────────────────────────────────────
function updateColSuggestions() {
  colDatalist.innerHTML = '';
  FIELD_DICT.filter(f => !S.columns.includes(f)).forEach(f => {
    const opt = document.createElement('option'); opt.value = f; colDatalist.appendChild(opt);
  });
}

addColBtn.addEventListener('click', () => {
  addColBtn.classList.add('hidden'); colAddForm.classList.remove('hidden');
  updateColSuggestions(); colNameInp.value = ''; colNameInp.focus();
});
colCancelBtn.addEventListener('click', () => { colAddForm.classList.add('hidden'); addColBtn.classList.remove('hidden'); });
colAddForm.addEventListener('submit', e => {
  e.preventDefault();
  const col = colNameInp.value.trim();
  if (!col) return;
  if (col === 'Band Name') { alert('"Band Name" is reserved.'); return; }
  if (S.columns.includes(col)) { alert(`"${col}" already exists.`); return; }
  S.columns.push(col); markUnsaved(true); renderTable();
  colAddForm.classList.add('hidden'); addColBtn.classList.remove('hidden');
});

function deleteColumn(col) {
  if (!confirm(`Delete column "${col}"?`)) return;
  S.columns = S.columns.filter(c => c !== col);
  S.bands.forEach(band => {
    const k = key(band, col);
    delete S.cells[k]; delete S.formulas[k]; delete S.confidence[k]; delete S.confirmed[k];
  });
  markUnsaved(true); renderTable();
}

// ── AI extraction ─────────────────────────────────────────────────────────────
extractBtn.addEventListener('click', () => extractPage());

async function extractPage(pageOverride) {
  const pageNum  = pageOverride ?? S.currentPage;
  const isManual = pageOverride === undefined;
  if (isManual) { extractBtn.disabled = true; extractBtn.classList.add('busy'); extractStat.textContent = 'Extracting…'; }
  try {
    const res = await fetch('/api/extract', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({page_number: pageNum, year: S.year}),
    });
    if (!res.ok) {
      const errText = await res.text();
      if (isManual) extractStat.textContent = `Server error: ${errText.substring(0,200)}`; return;
    }
    const data = await res.json();
    if (data.error) { if (isManual) extractStat.textContent = 'Error: ' + data.error; return; }
    const BAND_KEYS = new Set(['Band','Band Name','band','band name']);
    const cols = (data.columns || []).filter(c => !BAND_KEYS.has(c));
    const newCols = cols.filter(c => !S.columns.includes(c));
    if (newCols.length) S.columns.push(...newCols);
    let filled = 0;
    (data.rows || []).forEach(row => {
      const bandName = row.band || row['Band'] || row['Band Name'] || '';
      if (!bandName) return;
      if (!S.bands.includes(bandName)) S.bands.push(bandName);
      cols.forEach(col => {
        const k = key(bandName, col);
        if (S.confirmed[k]) return;
        const raw = row[col]; const val = raw != null ? String(raw) : '';
        S.cells[k] = val; S.confidence[k] = 0.85;
        if (val !== '') filled++;
      });
    });
    if (filled > 0) markUnsaved(true);
    renderTable();
    if (isManual) {
      const rowCount = (data.rows || []).length;
      if (rowCount === 0) {
        extractStat.textContent = pageNum === 1
          ? `Page ${pageNum}: no scoring table found`
          : `Page ${pageNum}: no structured data found`;
      } else if (pageNum === 1) {
        extractStat.textContent = `Page ${pageNum}: ${rowCount} rows, ${cols.length} cols — ${filled} cells`;
      } else {
        extractStat.textContent =
          `Page ${pageNum} extracted — ${rowCount} rows, ${cols.length} columns. Captured as supplemental data for this page.`;
      }
    }
  } catch (err) {
    if (isManual) extractStat.textContent = 'Error: ' + err.message;
  } finally {
    if (isManual) { extractBtn.disabled = isComplete(); extractBtn.classList.remove('busy'); }
  }
}

// ── Column rename ─────────────────────────────────────────────────────────────
function startColRename(col, span) {
  const inp = document.createElement('input');
  inp.type = 'text'; inp.className = 'col-rename-input'; inp.value = col;
  let committed = false;
  const restore = () => { if (inp.parentNode) inp.replaceWith(span); };
  inp.addEventListener('keydown', async e => {
    if (e.key === 'Enter') {
      e.preventDefault(); if (committed) return; committed = true;
      const newName = inp.value.trim(); restore();
      if (newName && newName !== col) await renameColumn(col, newName);
    } else if (e.key === 'Escape') { e.preventDefault(); committed = true; restore(); }
  });
  inp.addEventListener('blur', () => { if (!committed) restore(); });
  span.replaceWith(inp); inp.focus(); inp.select();
}

async function renameColumn(oldName, newName) {
  if (newName === 'Band Name') { showToast('"Band Name" is reserved', 'error'); return; }
  if (S.columns.includes(newName)) { showToast(`"${newName}" already exists`, 'error'); return; }
  const idx = S.columns.indexOf(oldName); if (idx === -1) return;
  S.columns[idx] = newName;
  S.bands.forEach(b => {
    const ok = key(b, oldName), nk = key(b, newName);
    if (S.cells[ok]      !== undefined) { S.cells[nk]      = S.cells[ok];      delete S.cells[ok]; }
    if (S.formulas[ok]   !== undefined) { S.formulas[nk]   = S.formulas[ok];   delete S.formulas[ok]; }
    if (S.confidence[ok] !== undefined) { S.confidence[nk] = S.confidence[ok]; delete S.confidence[ok]; }
    if (S.confirmed[ok])               { S.confirmed[nk]   = true;             delete S.confirmed[ok]; }
  });
  renderTable();
  try {
    const res = await fetch('/api/rename_column', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({year: S.year, page: S.currentPage, old_name: oldName, new_name: newName}),
    });
    if (!res.ok) {
      const errText = await res.text();
      showToast(`Server error: ${errText.substring(0,200)}`, 'error');
      S.columns[idx] = oldName;
      S.bands.forEach(b => {
        const ok = key(b, oldName), nk = key(b, newName);
        if (S.cells[nk]      !== undefined) { S.cells[ok]      = S.cells[nk];      delete S.cells[nk]; }
        if (S.formulas[nk]   !== undefined) { S.formulas[ok]   = S.formulas[nk];   delete S.formulas[nk]; }
        if (S.confidence[nk] !== undefined) { S.confidence[ok] = S.confidence[nk]; delete S.confidence[nk]; }
        if (S.confirmed[nk])               { S.confirmed[ok]   = true;             delete S.confirmed[nk]; }
      });
      renderTable(); return;
    }
    const data = await res.json();
    if (data.status === 'ok') showToast(`✓ Renamed "${oldName}" → "${newName}"`);
    else showToast(`Rename failed: ${data.message}`, 'error');
  } catch (err) {
    showToast('Rename error: ' + err.message, 'error'); markUnsaved(true);
  }
}

function renameBand(oldName, newName, ri) {
  S.bands[ri] = newName;
  S.columns.forEach(col => {
    const ok = key(oldName, col), nk = key(newName, col);
    if (S.cells[ok]      !== undefined) { S.cells[nk]      = S.cells[ok];      delete S.cells[ok]; }
    if (S.formulas[ok]   !== undefined) { S.formulas[nk]   = S.formulas[ok];   delete S.formulas[ok]; }
    if (S.confidence[ok] !== undefined) { S.confidence[nk] = S.confidence[ok]; delete S.confidence[ok]; }
    if (S.confirmed[ok])               { S.confirmed[nk]   = true;             delete S.confirmed[ok]; }
  });
  markUnsaved(true);
}

// ── Save ──────────────────────────────────────────────────────────────────────
saveBtn.addEventListener('click', async () => {
  const rows = S.bands.map(band => {
    const row = {'Band Name': band};
    S.columns.forEach(col => { row[col] = S.cells[key(band, col)] || ''; });
    return row;
  });
  try {
    const res = await fetch('/api/data', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({year: S.year, columns: S.columns, rows, page_number: S.currentPage, formulas: S.formulas}),
    });
    if (res.ok) { markUnsaved(false); showToast('✓ Saved'); }
    else { const errText = await res.text(); showToast(`Save failed: ${errText.substring(0,200)}`, 'error'); }
  } catch (err) { showToast('Save error: ' + err.message, 'error'); }
});

// ── Mark Year Complete ────────────────────────────────────────────────────────
const completeModal      = document.getElementById('complete-modal');
const completeBody       = document.getElementById('complete-modal-body');
const completeCancelBtn  = document.getElementById('complete-cancel-btn');
const completeConfirmBtn = document.getElementById('complete-confirm-btn');

markCompleteBtn.addEventListener('click', async () => {
  try {
    const res = await fetch(`/api/info?year=${S.year}`);
    if (!res.ok) throw new Error(await res.text());
    const info = await res.json();
    const pagesData = info.pages_with_data || [];
    if (pagesData.length === 0) {
      showToast('No data to archive. Add data first.', 'error'); return;
    }
    const pageLinesHtml = pagesData.map(p =>
      `Page ${p.page}: <strong>${p.bands}</strong> rows × <strong>${p.cols}</strong> cols`
    ).join('<br>');
    completeBody.innerHTML =
      `Mark <strong>${S.year}</strong> as complete?<br><br>` +
      pageLinesHtml + '<br>' +
      `Total populated cells: <strong>${info.total_cells}</strong><br><br>` +
      `This will archive a CSV to the server and make the grid read-only.<br>` +
      `You can unlock it later if needed.`;
    completeModal.classList.add('visible');
  } catch (err) {
    showToast('Error: ' + err.message, 'error');
  }
});
completeCancelBtn.addEventListener('click', () => completeModal.classList.remove('visible'));
completeConfirmBtn.addEventListener('click', async () => {
  completeModal.classList.remove('visible');
  try {
    const res = await fetch('/api/mark_year_complete', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({year: S.year}),
    });
    if (!res.ok) { const t = await res.text(); showToast(`Server error: ${t.substring(0,200)}`, 'error'); return; }
    const data = await res.json();
    if (data.error) { showToast(data.error, 'error'); return; }
    S.yearStatuses[S.year] = 'complete';
    updateCompleteUI();
    updateYearSelectorOptions();
    const summaryParts = (data.page_summaries || []).map(
      ps => `Page ${ps.page}: ${ps.bands} rows × ${ps.cols} cols`
    );
    const summaryStr = summaryParts.length
      ? summaryParts.join(', ')
      : `${data.total_cells} cells`;
    showToast(`✓ ${S.year} marked complete. ${summaryStr} archived.`);
    window.location.href = `/api/export/csv?year=${S.year}`;
  } catch (err) { showToast('Error: ' + err.message, 'error'); }
});

// ── Unlock Year ───────────────────────────────────────────────────────────────
const unlockModal      = document.getElementById('unlock-modal');
const unlockModalBody  = document.getElementById('unlock-modal-body');
const unlockCancelBtn  = document.getElementById('unlock-cancel-btn');
const unlockConfirmBtn = document.getElementById('unlock-confirm-btn');

unlockBtn.addEventListener('click', () => {
  unlockModalBody.innerHTML =
    `Unlock <strong>${S.year}</strong> for editing?<br><br>` +
    `The archived CSV at <code>completed/${S.year}.csv</code> will remain on disk as a snapshot.<br>` +
    `You can mark it complete again at any time.`;
  unlockModal.classList.add('visible');
});
unlockCancelBtn.addEventListener('click', () => unlockModal.classList.remove('visible'));
unlockConfirmBtn.addEventListener('click', async () => {
  unlockModal.classList.remove('visible');
  try {
    const res = await fetch('/api/unlock_year', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({year: S.year}),
    });
    if (!res.ok) { const t = await res.text(); showToast(`Server error: ${t.substring(0,200)}`, 'error'); return; }
    S.yearStatuses[S.year] = 'in_progress';
    updateCompleteUI();
    updateYearSelectorOptions();
    renderTable();
    showToast(`${S.year} unlocked. You can edit again.`);
  } catch (err) { showToast('Error: ' + err.message, 'error'); }
});

// ── Upload CSV ────────────────────────────────────────────────────────────────
const uploadModal     = document.getElementById('upload-modal');
const uploadFileInput = document.getElementById('upload-file-input');
const uploadYearDisp  = document.getElementById('upload-year-display');
const uploadPreview   = document.getElementById('upload-preview');
const uploadWarnings  = document.getElementById('upload-warnings');
const uploadCancelBtn = document.getElementById('upload-cancel-btn');
const uploadConfirmBtn= document.getElementById('upload-confirm-btn');

let parsedCsvData = null;

function parseSimpleCsv(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  if (!lines.length) return null;

  function splitLine(line) {
    const result = [];
    let cur = '', inQuote = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') { inQuote = !inQuote; }
      else if (ch === ',' && !inQuote) { result.push(cur); cur = ''; }
      else { cur += ch; }
    }
    result.push(cur);
    return result.map(s => s.trim().replace(/^"|"$/g, ''));
  }

  const headers = splitLine(lines[0]);
  const rows = lines.slice(1).map(l => {
    const vals = splitLine(l);
    const obj = {};
    headers.forEach((h, i) => { obj[h] = vals[i] !== undefined ? vals[i] : ''; });
    return obj;
  }).filter(r => Object.values(r).some(v => v.trim()));

  return { headers, rows };
}

uploadCsvBtn.addEventListener('click', () => {
  if (isComplete()) { showToast(`Year ${S.year} is marked complete. Unlock first to upload.`, 'error'); return; }
  uploadYearDisp.textContent = S.year;
  uploadFileInput.value = '';
  uploadPreview.classList.add('hidden');
  uploadWarnings.classList.add('hidden');
  uploadConfirmBtn.disabled = true;
  parsedCsvData = null;
  uploadModal.classList.add('visible');
});

uploadFileInput.addEventListener('change', () => {
  const file = uploadFileInput.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const text = e.target.result;
    const parsed = parseSimpleCsv(text);
    if (!parsed) { uploadPreview.textContent = 'Could not parse CSV.'; uploadPreview.classList.remove('hidden'); return; }

    const { headers, rows } = parsed;
    const bandCol    = headers.find(h => h.toLowerCase() === 'band');
    const yearCol    = headers.find(h => h.toLowerCase() === 'year');
    const pageNumCol = headers.find(h => h.toLowerCase() === 'page_number');
    const dataCols   = headers.filter(h => h !== bandCol && h !== yearCol && h !== pageNumCol);

    if (!bandCol) {
      uploadPreview.textContent = "Error: CSV must include a 'band' column.";
      uploadPreview.classList.remove('hidden');
      uploadConfirmBtn.disabled = true; parsedCsvData = null; return;
    }

    const mismatched = rows.filter(r => yearCol && r[yearCol] && parseInt(r[yearCol]) !== S.year);
    if (mismatched.length) {
      uploadPreview.textContent = `Error: Row contains year ${mismatched[0][yearCol]}, expected ${S.year}.`;
      uploadPreview.classList.remove('hidden');
      uploadConfirmBtn.disabled = true; parsedCsvData = null; return;
    }

    const pages = pageNumCol
      ? [...new Set(rows.map(r => r[pageNumCol]).filter(Boolean))].length
      : 1;
    const pageInfo = pages > 1 ? ` (${pages} pages)` : '';
    const mode = document.querySelector('input[name="upload-mode"]:checked').value;

    let preview;
    if (mode === 'replace') {
      preview = `${rows.length} rows × ${dataCols.length} data cols${pageInfo} → ${S.year} [REPLACE]\n` +
        `Will wipe matching (year, page) data and insert up to ${rows.length * dataCols.length} cells.`;
    } else {
      preview = `${rows.length} rows × ${dataCols.length} data cols${pageInfo} → ${S.year} [MERGE]\n` +
        `Will update/insert cells present in CSV; leave other cells untouched.`;
    }

    const warns = [];
    rows.forEach((row, ri) => {
      dataCols.forEach(col => {
        const v = row[col];
        if (v && isNaN(parseFloat(v))) warns.push(`Row ${ri + 2} (${row[bandCol]}), "${col}": "${v}" is not numeric`);
      });
    });

    uploadPreview.textContent = preview;
    uploadPreview.classList.remove('hidden');
    if (warns.length) {
      uploadWarnings.textContent = '⚠ Non-numeric values:\n' + warns.slice(0,5).join('\n') + (warns.length > 5 ? `\n…and ${warns.length - 5} more` : '');
      uploadWarnings.classList.remove('hidden');
    } else {
      uploadWarnings.classList.add('hidden');
    }

    parsedCsvData = { file, rows, dataCols, warns };
    uploadConfirmBtn.disabled = false;
  };
  reader.readAsText(file);
});

document.querySelectorAll('input[name="upload-mode"]').forEach(rb => {
  rb.addEventListener('change', () => { if (parsedCsvData) uploadFileInput.dispatchEvent(new Event('change')); });
});

uploadCancelBtn.addEventListener('click', () => { uploadModal.classList.remove('visible'); parsedCsvData = null; });

uploadConfirmBtn.addEventListener('click', async () => {
  if (!parsedCsvData) return;
  uploadConfirmBtn.disabled = true;
  const mode = document.querySelector('input[name="upload-mode"]:checked').value;
  const formData = new FormData();
  formData.append('file', parsedCsvData.file);
  formData.append('year', S.year);
  formData.append('mode', mode);
  try {
    const res = await fetch('/api/upload_csv', { method: 'POST', body: formData });
    if (!res.ok) {
      const errText = await res.text();
      showToast(`Server error: ${errText.substring(0, 200)}`, 'error');
      uploadConfirmBtn.disabled = false; return;
    }
    const data = await res.json();
    if (data.error) { showToast(data.error, 'error'); uploadConfirmBtn.disabled = false; return; }

    uploadModal.classList.remove('visible'); parsedCsvData = null;

    let msg = `✓ Upload complete (${mode}): `;
    if (mode === 'replace') msg += `deleted ${data.rows_deleted}, inserted ${data.rows_inserted} records.`;
    else msg += `updated ${data.rows_updated}, inserted ${data.rows_inserted} records.`;
    showToast(msg);

    if (data.warnings && data.warnings.length) {
      setTimeout(() => showToast('⚠ Warnings: ' + data.warnings.slice(0,3).join('; '), 'warn'), 3500);
    }

    await loadYear(S.year);
  } catch (err) {
    showToast('Upload error: ' + err.message, 'error');
    uploadConfirmBtn.disabled = false;
  }
});

// ── Load Year ─────────────────────────────────────────────────────────────────
const loadYearBtn        = document.getElementById('load-year-btn');
const loadYearModal      = document.getElementById('load-year-modal');
const loadYearStatus     = document.getElementById('load-year-status');
const loadYearSelect     = document.getElementById('load-year-select');
const loadYearCancelBtn  = document.getElementById('load-year-cancel-btn');
const loadYearConfirmBtn = document.getElementById('load-year-confirm-btn');

loadYearBtn.addEventListener('click', async () => {
  loadYearModal.classList.add('visible');
  loadYearSelect.innerHTML = '';
  loadYearSelect.disabled = true;
  loadYearConfirmBtn.disabled = true;
  loadYearStatus.className = '';
  loadYearStatus.textContent = 'Fetching available years from pipeline…';
  try {
    const res = await fetch('/api/available_years');
    const data = await res.json();
    if (data.error) {
      loadYearStatus.className = 'error';
      loadYearStatus.textContent = `Cannot reach pipeline: ${data.error}`;
      return;
    }
    if (!data.available || data.available.length === 0) {
      loadYearStatus.textContent = 'All available pipeline years are already loaded.';
      return;
    }
    loadYearStatus.textContent =
      `${data.available.length} year${data.available.length === 1 ? '' : 's'} available — pick one to load:`;
    data.available.sort((a, b) => a - b).forEach(y => {
      const opt = document.createElement('option');
      opt.value = y;
      opt.textContent = `${y} (not loaded)`;
      loadYearSelect.appendChild(opt);
    });
    loadYearSelect.disabled = false;
    loadYearConfirmBtn.disabled = false;
  } catch (err) {
    loadYearStatus.className = 'error';
    loadYearStatus.textContent = `Error: ${err.message}`;
  }
});

loadYearCancelBtn.addEventListener('click', () => loadYearModal.classList.remove('visible'));

loadYearConfirmBtn.addEventListener('click', async () => {
  const year = parseInt(loadYearSelect.value);
  if (!year) return;
  loadYearConfirmBtn.disabled = true;
  loadYearConfirmBtn.classList.add('loading');
  loadYearCancelBtn.disabled = true;
  loadYearStatus.className = '';
  loadYearStatus.textContent = `Loading ${year}… (transferring PDF + converting pages, ~15–45 s)`;
  try {
    const res = await fetch('/api/load_year', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({year}),
    });
    const data = await res.json();
    if (data.error) {
      loadYearStatus.className = 'error';
      loadYearStatus.textContent = `Error: ${data.error}`;
      loadYearConfirmBtn.disabled = false;
      loadYearConfirmBtn.classList.remove('loading');
      loadYearCancelBtn.disabled = false;
      return;
    }

    loadYearModal.classList.remove('visible');

    let msg = `✓ ${year} loaded — ${data.pages_generated} page${data.pages_generated === 1 ? '' : 's'} generated. Available in year selector.`;
    if (data.conversion_error) msg += ` ⚠ Conversion note: ${data.conversion_error.substring(0, 80)}`;
    showToast(msg);

    // Refresh year selector with newly available year
    const yRes = await fetch('/api/years');
    if (yRes.ok) {
      const yData = await yRes.json();
      S.availYears = yData.years || S.availYears;
    }
    const stRes = await fetch('/api/year_statuses');
    if (stRes.ok) {
      const stData = await stRes.json();
      S.yearStatuses = stData.statuses || S.yearStatuses;
    }
    yearSelect.innerHTML = '';
    S.availYears.forEach(y => {
      const opt = document.createElement('option');
      opt.value = y;
      opt.textContent = S.yearStatuses[y] === 'complete' ? `${y} ✓` : String(y);
      yearSelect.appendChild(opt);
    });

    // Auto-select and load the newly loaded year
    await loadYear(year);
  } catch (err) {
    loadYearStatus.className = 'error';
    loadYearStatus.textContent = `Error: ${err.message}`;
    loadYearConfirmBtn.disabled = false;
    loadYearConfirmBtn.classList.remove('loading');
    loadYearCancelBtn.disabled = false;
  } finally {
    loadYearCancelBtn.disabled = false;
  }
});

window.addEventListener('beforeunload', e => { if (S.unsaved) { e.preventDefault(); e.returnValue = ''; } });

// ── Year selector ─────────────────────────────────────────────────────────────
function updateYearSelectorOptions() {
  Array.from(yearSelect.options).forEach(opt => {
    const y = parseInt(opt.value);
    const isComp = S.yearStatuses[y] === 'complete';
    opt.textContent = isComp ? `${y} ✓` : String(y);
  });
}

yearSelect.addEventListener('change', async () => {
  const newYear = parseInt(yearSelect.value);
  if (newYear === S.year) return;
  if (S.unsaved) {
    const ok = confirm(`You have unsaved changes for ${S.year}.\nDiscard and switch to ${newYear}?`);
    if (!ok) { yearSelect.value = S.year; return; }
  }
  await loadYear(newYear);
});

// ── Load year ─────────────────────────────────────────────────────────────────
async function loadYear(year) {
  yearLoading.style.display = 'inline';
  extractStat.textContent = '';
  S.year = year; S.currentPage = 1; S.pagesPrefix = "";
  S.bands = []; S.infoBands = []; S.columns = []; S.cells = {}; S.formulas = {};
  S.confidence = {}; S.confirmed = {}; S.unsaved = false;

  try {
    const infoRes = await fetch(`/api/info?year=${year}`);
    if (!infoRes.ok) throw new Error(`/api/info: ${await infoRes.text().then(t => t.substring(0,200))}`);
    const dataRes = await fetch(`/api/data?year=${year}&page=1`);
    if (!dataRes.ok) throw new Error(`/api/data: ${await dataRes.text().then(t => t.substring(0,200))}`);
    const [info, data] = await Promise.all([infoRes.json(), dataRes.json()]);

    S.pageCount   = info.page_count || 0;
    S.pagesPrefix = info.pages_url_prefix || "";
    S.infoBands   = info.bands || [];
    // Use saved bands if available; fall back to pre-populated list for fresh years
    S.bands       = (data.bands && data.bands.length > 0) ? data.bands : S.infoBands;
    S.columns     = data.columns || [];
    S.cells       = data.cells   || {};
    S.formulas    = data.formulas || {};
    if (info.status) S.yearStatuses[year] = info.status;

    Object.keys(S.formulas).forEach(k => { S.confirmed[k] = true; });

    lblYear.textContent = year;
    yearSelect.value    = year;
    updateCompleteUI();
    updateYearSelectorOptions();
    updatePage();
    renderTable();
    markUnsaved(false);

    // Auto-extract page 1 only when no data exists yet
    if (S.columns.length === 0 && S.pageCount > 0 && !isComplete()) {
      extractBtn.disabled = true; extractBtn.classList.add('busy');
      extractStat.textContent = `Auto-extracting page 1…`;
      await extractPage(1);
      const pageNote = S.pageCount > 1
        ? ` (${S.pageCount} pages total — navigate to extract more)`
        : '';
      extractStat.textContent =
        `Page 1: ${S.bands.length} rows, ${S.columns.length} cols — auto-extracted${pageNote}`;
      extractBtn.disabled = false; extractBtn.classList.remove('busy');
    }
  } catch (err) {
    statusInd.textContent = 'Load error: ' + err.message; statusInd.className = 'unsaved';
  } finally {
    yearLoading.style.display = 'none';
  }
}

// ── Init ──────────────────────────────────────────────────────────────────────
async function init() {
  try {
    const yRes = await fetch('/api/years');
    if (!yRes.ok) throw new Error(`/api/years: ${await yRes.text().then(t => t.substring(0,200))}`);
    const yData = await yRes.json();
    S.availYears = yData.years || [1977];

    const stRes = await fetch('/api/year_statuses');
    if (stRes.ok) {
      const stData = await stRes.json();
      S.yearStatuses = stData.statuses || {};
    }

    yearSelect.innerHTML = '';
    S.availYears.forEach(y => {
      const opt = document.createElement('option');
      opt.value = y;
      opt.textContent = S.yearStatuses[y] === 'complete' ? `${y} ✓` : String(y);
      yearSelect.appendChild(opt);
    });

    await loadYear(S.availYears[S.availYears.length - 1] || 1977);
  } catch (err) {
    statusInd.textContent = 'Init error: ' + err.message; statusInd.className = 'unsaved';
  }
}

init();
</script>
